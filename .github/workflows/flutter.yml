name: Flutter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: apk --debug}
          - {os: ubuntu-24.04, target: linux --release}
          - {os: macos-15, target: macos --debug}
          - {os: macos-15, target: ios --simulator --debug}
          - {os: windows-2022, target: windows --debug}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          cache: true
      - if: startsWith(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev ninja-build clang cmake pkg-config
      - if: startsWith(matrix.target, 'apk')
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get --enforce-lockfile
      - if: startsWith(matrix.target, 'apk')
        run: find lib test integration_test tool -name '*.dart' -not -path 'lib/l10n/generated/*' -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - if: startsWith(matrix.target, 'apk')
        run: flutter analyze
      - if: startsWith(matrix.target, 'apk')
        run: flutter test
      - run: flutter build ${{ matrix.target }} --no-pub
