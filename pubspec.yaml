name: witor
description: "On-device Wi-Fi diagnostics."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  network_info_plus: ^6.1.4
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.3
  xml: ^6.6.1
  html: ^0.15.6
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  nm: ^0.5.0
  url_launcher: ^6.3.0
  # image 4.11 calls an archive API unavailable with this Flutter SDK.
  image: 4.5.4
  flutter_inappwebview: ^6.1.5
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  pdf: ^3.11.3
  file_saver: ^0.3.1
  connectivity_plus: ^6.1.5
  flutter:
    sdk: flutter

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/witor.png
    - assets/brand/witor-mark.png
    - assets/fonts/
